[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-on-device-sampling"
version = "0.2.0"
description = "Experimental identity-bound StateAxis device sampling policy"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-on-device-sampling" = "stateaxis_on_device_sampling"

[project.entry-points."stateaxis.mod_handlers"]
on_device_sampling = "stateaxis_on_device_sampling:on_device_sampling"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_on_device_sampling"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
